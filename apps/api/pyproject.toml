[project]
name = "contest-api"
version = "0.1.0"
description = "参赛项目 · 后端服务"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI 的 Depends() 必须写在参数默认值里，这是框架约定
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
