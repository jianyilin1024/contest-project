name: Build Images

# 在 GitHub Actions 上构建镜像并推到 ghcr.io。
# 服务器因此不需要构建，2 核 2G 的机器也能跑起来。
# 首次运行后，建议把 Packages 的可见性改为 public（仓库 → Packages → 包设置），
# 这样服务器 docker pull 时不需要登录。

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contest-api
            context: ./apps/api
          - name: contest-web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
